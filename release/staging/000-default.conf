<VirtualHost *:80>
        ServerName demo-popo11test.pigeon-demo.com
        ServerAdmin ishikawa@loftal.jp
        DocumentRoot /var/www/PopoframeworkSlimCloud/public
        #DocumentRoot /var/www/vhosts/pigeon-maintenance
#SSLVerifyClient require
#SSLVerifyDepth 10
#SSLCACertificateFile /home/ubuntu/rootCA/cacert.pem

        ErrorLog ${APACHE_LOG_DIR}/pigeon-demo11.error.log
        CustomLog ${APACHE_LOG_DIR}/pigeon-demo11.access.log combined
    <Directory "/var/www/PopoframeworkSlimCloud/public">
        AllowOverRide All
    </Directory>

        RewriteEngine On
  RewriteCond %{ENV:SuspectHardDoS} =1
  RewriteCond %{REMOTE_ADDR} !127.0.0.0
  RewriteRule .*  - [R=403,L]
RewriteCond %{SERVER_NAME} =demo-popo11.pigeon-demo.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>


