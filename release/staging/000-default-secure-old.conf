<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName demo-popo11test.pigeon-demo.com
        ServerAdmin ishikawa@loftal.jp
        DocumentRoot /var/www/PopoframeworkSlimCloud/public
        #DocumentRoot /var/www/vhosts/pigeon-maintenance
SSLVerifyClient require
SSLVerifyDepth 1
SSLCACertificateFile /home/ubuntu/rootCA2/demoCA/cacert.pem
#失効
SSLCARevocationCheck chain
SSLCARevocationFile /home/ubuntu/rootCA2/demoCA/revoke.crl


        ErrorLog ${APACHE_LOG_DIR}/pigeon-demo11.error.log
        CustomLog ${APACHE_LOG_DIR}/pigeon-demo11.access.log combined
    <Directory "/var/www/PopoframeworkSlimCloud/public">
        AllowOverRide All
    </Directory>

        RewriteEngine On
  RewriteCond %{ENV:SuspectHardDoS} =1
  RewriteCond %{REMOTE_ADDR} !127.0.0.0
  RewriteRule .*  - [R=403,L]

SSLCertificateFile /etc/letsencrypt/live/demo-popo11.pigeon-demo.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/demo-popo11.pigeon-demo.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
<VirtualHost *:443>
        ServerName test.pigeon-demo-sec.com
        ServerAlias *.pigeon-demo-sec.com
        ServerAdmin ishikawa@loftal.jp
        DocumentRoot /var/www/PopoframeworkSlimCloud/public
        #DocumentRoot /var/www/vhosts/pigeon-maintenance
SSLVerifyClient require
SSLVerifyDepth 1
SSLCACertificateFile /home/ubuntu/rootCA2/demoCA/cacert.pem
#失効
SSLCARevocationCheck chain
SSLCARevocationFile /home/ubuntu/rootCA2/demoCA/revoke.crl


        ErrorLog ${APACHE_LOG_DIR}/pigeon-demo11.error.log
        CustomLog ${APACHE_LOG_DIR}/pigeon-demo11.access.log combined
    <Directory "/var/www/PopoframeworkSlimCloud/public">
        AllowOverRide All
    </Directory>

        RewriteEngine On
  RewriteCond %{ENV:SuspectHardDoS} =1
  RewriteCond %{REMOTE_ADDR} !127.0.0.0
  RewriteRule .*  - [R=403,L]

#SSLCertificateFile /etc/letsencrypt/live/demo-popo11.pigeon-demo.com/fullchain.pem
#SSLCertificateKeyFile /etc/letsencrypt/live/demo-popo11.pigeon-demo.com/privkey.pem
SSLCertificateFile /etc/letsencrypt/live/pigeon-demo-sec.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/pigeon-demo-sec.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
