<VirtualHost *:80>
        ServerName next.pigeon-cloud.com
        #ServerAlias *.pigeon-cloud-sec.com g78yoldy9l.pigeon-cloud.com g78yoldy9l.pigeon-cloud-sec.com ishikawa.pigeon-cloud.com ishikawa.pigeon-cloud-sec.com
        #ServerAlias file-test.pigeon-cloud.com file-test2.pigeon-cloud.com file-test3.pigeon-cloud.com l-akahori.pigeon-cloud.com w1q743iue5.pigeon-cloud.com
        ServerAdmin ishikawa@loftal.jp
        DocumentRoot /var/www/PopoframeworkSlimCloudNext/public
        #DocumentRoot /var/www/vhosts/pigeon-maintenance
    # 必要なヘッダーを渡す
    RequestHeader set SSL_CLIENT_CERT "%{HTTP:X-Forwarded-Client-Cert}e"
    RequestHeader set SSL_CLIENT_S_DN "%{HTTP:X-Forwarded-Client-Cert}e"

        ErrorLog ${APACHE_LOG_DIR}/pigeon.error.log
        CustomLog ${APACHE_LOG_DIR}/pigeon.access.log combined
        LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Client-Cert}i\"" ssl_custom_log
        CustomLog  ${APACHE_LOG_DIR}/pigeon.ssl_access_log ssl_custom_log

    <Directory "/var/www/PopoframeworkSlimCloudNext/public">
        AllowOverRide All
    </Directory>

        RewriteEngine On
  RewriteCond %{ENV:SuspectHardDoS} =1
  RewriteCond %{REMOTE_ADDR} !127.0.0.0
  RewriteCond %{REMOTE_ADDR} !::1
  RewriteRule .*  - [R=403,L]
</VirtualHost>

