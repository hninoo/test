<div class="modal-dialog modal-default" role="document">
    <div class="modal-content">
        <div class="modal-body">
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" [class.active]="activeTab === 'basic'" (click)="changeTab('basic', $event)" href="#">基本設定</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" [class.active]="activeTab === 'permissions'" (click)="changeTab('permissions', $event)" href="#">権限設定</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" [class.active]="activeTab === 'fields'" (click)="changeTab('fields', $event)" href="#">項目</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" [class.active]="activeTab === 'colors'" (click)="changeTab('colors', $event)" href="#">色をつける</a>
                </li>
            </ul>
            
            <div class="tab-content">
                <!-- 基本設定タブ -->
                <div class="tab-pane" [class.active]="activeTab === 'basic'" [class.show]="activeTab === 'basic'">
                    <div class="mt-3">
                        <h5>フィルター基本設定</h5>
                        <div class="form-group mb-3">
                            <label>フィルター名</label>
                            <input type="text" class="form-control" [(ngModel)]="edittingCustomFilter.name" placeholder="フィルター名を入力してください">
                        </div>
                    </div>
                </div>
                
                <!-- 権限設定タブ -->
                <div class="tab-pane" [class.active]="activeTab === 'permissions'" [class.show]="activeTab === 'permissions'">
                    <div class="mt-3">
                        <h5>権限設定</h5>
                        <div class="form-group">
                            <div class="checkbox mb-2">
                                <label><input type="radio" name="grant" [(ngModel)]="edittingCustomFilter.grant" value="public">&nbsp;全員に表示</label>
                            </div>
                            <div class="checkbox mb-2">
                                <label><input type="radio" name="grant" [(ngModel)]="edittingCustomFilter.grant" value="private">&nbsp;自分のみ表示</label>
                            </div>
                            <div class="checkbox mb-2">
                                <label><input type="radio" name="grant" [(ngModel)]="edittingCustomFilter.grant" value="custom">&nbsp;詳細権限設定</label>
                            </div>

                            <ng-container *ngIf="edittingCustomFilter.grant === 'custom'">
                                <div class="mt-3 mb-3">
                                    <hr>
                                    <grant-group-form [value]="edittingCustomFilter.edit_grant_group_id" 
                                                    [title]="'編集可能ユーザー'" 
                                                    (onChangeValue)="onEditGrantGroupIdChanged($event)" 
                                                    [grant_kind]="'edit'"></grant-group-form>
                                    <hr>
                                    <grant-group-form [value]="edittingCustomFilter.view_grant_group_id" 
                                                    [title]="'閲覧のみ可能ユーザー'" 
                                                    (onChangeValue)="onViewGrantGroupIdChanged($event)" 
                                                    [grant_kind]="'view'"></grant-group-form>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </div>

                <!-- 項目タブ -->
                <div class="tab-pane" [class.active]="activeTab === 'fields'" [class.show]="activeTab === 'fields'">
                    <div class="mt-3" cdkDropList (cdkDropListDropped)="drop($event)">
                        <h5>マップ情報ウィンドウの表示項目</h5>
                        <p>表示項目が空の場合はすべての項目が表示され、表示項目が指定してある場合はその項目のみ表示されます。</p>
                        <p>表示項目は10個までしか選択できません。</p>

                        <field-select-dragdrop 
                            [table_info]="table_info" 
                            [selected_field_name_a]="edittingCustomFilter.info_modal_fields"
                            [maxSelectionLimit]="10"
                            (onChangeValue)="onInfoModalFieldsChanged($event)">
                        </field-select-dragdrop>
                    </div>
                </div>

                <!-- 色をつけるタブ -->
                <div class="tab-pane" [class.active]="activeTab === 'colors'" [class.show]="activeTab === 'colors'">
                    <div class="mt-3">
                        <h5>マーカーの色設定</h5>
                        <p>条件に一致するマーカーの色を変更できます。</p>
                        
                        <div class="marker-color-settings">
                            <button type="button" class="btn btn-primary mb-3" (click)="addMarkerColor()">色設定を追加</button>
                            <p class="text-muted">設定が登録されていない場合、すべてのマーカーは赤色で表示されます。</p>

                            <div *ngFor="let colorSetting of edittingCustomFilter.marker_colors; let i = index" class="mb-3 p-3 border rounded">
                                <div class="d-flex align-items-center mb-2">
                                    <img [src]="getMarkerIconPreviewUrl(colorSetting)" 
                                         alt="marker preview" 
                                         style="height: 32px; margin-right: 10px;">
                                    <span>この色・種類のマーカー</span>
                                </div>

                                <div class="form-group">
                                    <label>マーカーの色</label>
                                    <select class="form-control" [(ngModel)]="colorSetting.color">
                                        <option *ngFor="let color of allColors" [value]="color.value">{{ color.label }}</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>マーカーの種類</label>
                                    <select class="form-control" [(ngModel)]="colorSetting.iconType" (change)="onIconTypeChanged(colorSetting)">
                                        <option value="dot">丸型（デフォルト）</option>
                                        <option value="pushpin">ピン型</option>
                                    </select>
                                </div>

                                <div class="conditions-section">
                                    <h6>条件設定</h6>
                                    <button class="btn btn-success btn-sm mb-2" (click)="addCondition(colorSetting)">
                                        <i class="fa fa-plus mr-1"></i>条件を追加
                                    </button>

                                    <div class="mb-1" *ngFor="let condition of colorSetting.conditions?.condition_a; let conditionIndex = index">
                                        <div class="condition-wrap">
                                            <condition-form 
                                                [table_info]="table_info"
                                                [table]="table_info.table"
                                                [default_condition]="condition"
                                                [index]="conditionIndex"
                                                [forms]="table_info.forms"
                                                (valueChanged)="onConditionChanged($event, i)">
                                            </condition-form>
                                            <div class="buttons">
                                                <button class="btn btn-danger btn-sm mt-1" (click)="removeCondition(colorSetting, conditionIndex)">
                                                    <i class="fa fa-minus"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button type="button" class="btn btn-danger btn-sm mt-2" (click)="removeMarkerColor(i)">この色設定を削除</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary text-bold" (click)="save()">保存</button>
            <button type="button" class="btn btn-warning text-bold" (click)="preview()">表示</button>
            <button type="button" class="btn btn-secondary text-bold" (click)="onClickCancelButton.emit()">キャンセル</button>
        </div>
    </div>
</div>
