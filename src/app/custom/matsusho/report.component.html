<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <i class="fa fa-th-list"></i> レポート1
            </div>
            <div class="card-block">
                <div *ngIf="loading;then loading_block else loaded_block"></div>
                <ng-template #loading_block>
                    <div class="loader">Loading...</div>
                </ng-template>
                <ng-template #loaded_block>
                    <div class="card-block">
                        <div class="row">
                            <div class="col-md-12">
                                <img src="{{get_api_url()}}/api/admin/file-by-id/1" style="max-width: 100%">
                            </div>
                            <div class="col-md-6">
                                <img src="{{get_api_url()}}/api/admin/file-by-id/3" style="max-width: 100%">
                            </div>
                            <div class="col-md-6">
                                <img src="{{get_api_url()}}/api/admin/file-by-id/4" style="max-width: 100%">
                            </div>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
    <!--/.col-->
</div>
<!--/.row-->
