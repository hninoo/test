<div id="pc-detail-view" class="row view-detail pc-detail-view" *ngIf="table_info!==undefined" [ngClass]="setClasses()">
    <div class="col-lg-12" *ngIf="before_html!=undefined">
        <div class="card card-accent-primary">
            <div class="card-block" [innerHTML]="before_html | safeHtml"></div>
        </div>
    </div>
    <memo class="col-lg-12" [table_info]="table_info" [view_name]="'view'"></memo>
    <div class="col-lg-12" *ngIf="content_html_before!=undefined">
        <div class="card card-accent-primary">
            <div class="card-block" [innerHTML]="content_html_before | safeHtml"></div>
        </div>
    </div>
    <div class="col-lg-12 pt-sm-2 p-0 p-md-2">
        <div class="card mb-50-mb">
            <div class="card-header dataset-detail" style="display:flex; align-items: center; justify-content: space-between;padding-bottom: 0.75rem!important; ">
                <div style="display: flex; align-items: center; justify-content: center;">
                    <h4 class="only-pc">詳細情報</h4>
                </div>
                <span class="ml-3">
                    <custom-filter-pulldown *ngIf="hasViewFilter() &&(table_info && (table_info.grant.table_author || !table_info.menu.not_display_filter_view))"
                                            [filter_type]="'view'"
                                            [mode]='"view"'
                                            [table_info]="table_info"
                                            [customFilter]="customFilter"
                                            (onReset)="resetFilter()"
                                            (onSelectFilter)="selectFilter($event)"
                                            (onEditFilter)="onEditFilter($event)"
                                            (onDeleteFilter)="onDeleteFilter($event)"
                    ></custom-filter-pulldown>
                </span>
                <div class="circle_wrap">
                    <div class="prev-next-wrap">
                        <button class="btn btn-prev" (click)="goToPrevAndNext()" *ngIf="previous_id"><i class="fa fa-angle-left"></i> 前のレコード</button>
                        <button class="btn btn-next" (click)="goToPrevAndNext(true)" *ngIf="next_id"> 次のレコード <i class="fa fa-angle-right"></i></button>
                    </div>
                    <a href="javascript:void(0)" class="circle nav-link nav-pill pull-right" role="button" aria-haspopup="true" aria-expanded="false" (click)="toggleSideMenu()" appAsideMenuToggler>
                        <i class="fa fa-bell icon-speech text-default"></i><span
                        *ngIf="!data.table_info.menu.merge_comment_and_history?data.comments.length>0 :  data.log_and_comments.log_and_comment_merge_a.length>0" class="badge badge-pill badge-warning">
                        <span *ngIf="data.table_info.menu.merge_comment_and_history;else NotMerge">
                        {{data.log_and_comments.log_and_comment_merge_a.length}}
                        </span>
                        <ng-template #NotMerge>
                        {{data.comments.length}}
                        </ng-template>
                    </span>
                    </a>
                </div>
            </div>
            <div class="col-lg-12" *ngIf="table_info.menu.use_google_map && table_info.menu.use_google_map_detail">
                <google-map
                    [data]="data"
                    [table_info]="table_info"
                    [filter]="googleMapFilter">
                </google-map>
            </div>
            <div class="card-block">
                <div *ngIf="no_data;else FOUND_DATA" style="text-align: center; padding: 40px;">
                    データが見つかりません。削除されている可能性があります。
                </div>
                <ng-template #FOUND_DATA>
                    <certificate-management *ngIf="showCertificateManagement && data?.raw_data?.id"
                                            [userId]="data.raw_data.id"
                                            [isMasterUser]="isMasterUser"
                                            (onCertificateChange)="onCertificateChange($event)">
                    </certificate-management>
                    <admin-view-content [extend_headers]="extend_headers" [extend_data]="extend_data" [data]="data" [loading]="loading" [reload]="reloadFunction"
                                        [table_info]="table_info"
                                        [customFilter]="customFilter"></admin-view-content>
                </ng-template>

                <div *ngIf="content_html!=undefined">
                    <div [innerHTML]="content_html | safeHtml"></div>
                </div>
            </div>
            <div class="card-footer text-right" *ngIf="data!=null && table_info && !loading">
                <div class="btn-box text-bold">
                    <button *ngIf="canCsvCancel() && data.raw_data['type']=='upload'" type="button" class="btn btn-danger" style="border-color: #e1e6ef;" (click)="this.csvUploadCancelModal.show()">
                        アップロードのキャンセル
                    </button>
                    <button *ngIf="canCsvCancel() && data.raw_data['type']=='download'" type="button" class="btn btn-danger" style="border-color: #e1e6ef;" (click)="csvCancelModal.show()">
                        ダウンロードのキャンセル
                    </button>
                    <button  *ngIf="true" type="button" class="btn" style="border-color: #e1e6ef;" (click)="goList()">戻る</button>
                    <ng-container *ngIf="data.workflow && (data.workflow.isApplyUser(_share.user.id) || table_info.menu.workflow_reapply_other_user)">
                        <button *ngIf="table_info.menu.workflow_reapply && data.workflow.status==='done'" class="btn btn-danger text-bold" (click)="workflow_withdraw()">
                            再申請(取り下げ)
                        </button>
                    </ng-container>
                    <ng-container *ngIf="data.workflow && data.workflow.isApplyUser(_share.user.id)">
                        <button *ngIf="data.workflow.status==='applying'" class="btn btn-danger text-bold" (click)="workflow_withdraw()">
                            申請取り下げ
                        </button>

                    </ng-container>
                    <button *ngIf="this.table === 'admin' && _share.isMasterUser() && this.data.raw_data['account_locked']" class="btn btn-outline-danger text-bold"
                        type="submit" (click)="accountUnlock()" [ladda]="loading">
                        <i class="fa fa-lock"></i>
                        アカウントロック解除
                    </button>
                    <button *ngIf="table_info.grant.permission_view  && this.table === 'admin'" class="btn btn-outline-primary text-bold"
                        type="submit" (click)="check_grant_permission(data)" [ladda]="loading">
                        プレビュー
                    </button>
                    <button *ngIf="table_info.grant.add && !table_info.menu.is_onlyone && !table_info.menu.hide_duplicate_button && table_info.grant.duplicate" class="btn btn-info text-bold"
                            type="submit"
                            (click)="new_with_copy(data)">
                        複製
                    </button>
                    <ng-container *ngIf="table_info.menu.is_workflow &&data.workflow &&  data.workflow.is_assigned;else NOT_WORKFLOW_ASSIGNED">
                        <button *ngIf="table_info.grant.edit" class="btn btn-danger text-bold" type="submit" (click)="workflow_reject()"> 否認
                        </button>
                        <button *ngIf="table_info.grant.edit && table_info.menu.workflow_back" class="btn btn-danger text-bold" type="submit" (click)="workflow_back()">一つ戻す
                        </button>
                        <button *ngIf="table_info.grant.edit" class="btn btn-success text-bold" type="submit" (click)="workflow_ok()"> 承認
                        </button>
                        <button *ngIf="table_info.grant.edit && data.isEditable()" class="btn btn-warning text-bold" type="submit" (click)="edit(data)"> 編集
                        </button>
                    </ng-container>
                    <ng-container *ngIf="table_info.menu.is_workflow &&data.workflow && !this.data.workflow.is_assigned && data.workflow.is_salvage_acceptable && table_info.menu.workflow_salvage">
                        <button *ngIf="table_info.grant.edit" class="btn btn-success text-bold" type="submit" (click)="workflow_ok()"> 引き上げ承認
                        </button>
                    </ng-container>
                    <ng-container *ngFor="let ledger of table_info.ledger_a">
                        <button class="btn btn-default pull-left ledger-button" style="color: #000 !important;" type="submit" (click)="outputLedger(ledger)" [ladda]="sending"><i class="fa fa-download"
                         [ngClass]="{'fa-file-pdf-o text-danger':ledger.download_pdf,'fa-file-excel-o text-success':!ledger.download_pdf}"></i> {{ledger.name}}
                        </button>
                    </ng-container>
                    <ng-container *ngIf="table_info.ledger_a.length > 0 && table_type == 'branc_invoice'">
                        <button type="button" class="btn pull-left" style="border-color: #e1e6ef;"  (click)="backInvoiceStatus()" [ladda]="sending">未発行に戻す</button>
                    </ng-container>
                    <ng-template #NOT_WORKFLOW_ASSIGNED>
                        <button *ngIf="table_info.grant.edit && data.isEditable()" class="btn btn-warning text-bold" type="submit" (click)="edit(data)"> 編集
                        </button>
                        <button *ngIf="table_info.grant.delete && data.isDeletable()" class="btn btn-danger text-bold" type="submit" (click)="openDeleteModal(data.raw_data)"> 削除
                        </button>

                        <ng-container *ngIf="table=='admin_invoices'">
                            <button
                                class="btn btn-default pull-left"
                                type="submit"
                                (click)="downloadStripeBilling()"
                                *ngIf="data.raw_data.status =='paid'"
                            >
                                <i class="fa fa-file-pdf-o text-danger"></i> 領収書ダウンロード
                            </button>
                            <button
                                class="btn btn-default pull-left"
                                type="submit"
                                (click)="downloadStripeBilling('slip')"
                            >
                                <i class="fa fa-file-pdf-o text-danger"></i> 請求書ダウンロード
                            </button>
                        </ng-container>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
    <!--/.col-->
    <confirm-modal #deleteModal [text]="'本当に削除してもよろしいですか？'" [submit_button_text]="'削除する'" (onOk)="delete(modal_data)" [type]="'danger'" [sending]="sending"></confirm-modal>

    <confirm-modal #workflowCancelModal [text]="'申請取り下げを行います。よろしいですか？'" [submit_button_text]="'取り下げを行う'" (onOk)="reapply()" [type]="'warning'" [sending]="sending"></confirm-modal>
    <confirm-modal #workflowWithdrawModal [text]="'承認済みの状態は解除されます。よろしいですか？'" [submit_button_text]="'再申請する'" (onOk)="reapply()" [type]="'warning'" [sending]="sending"></confirm-modal>

    <confirm-modal #csvCancelModal [text]="'ダウンロードをキャンセルします。よろしいですか？'" [submit_button_text]="'キャンセルする'" (onOk)="csvCancel()" [type]="'warning'"
                   [sending]="sending"></confirm-modal>
    <confirm-modal #csvUploadCancelModal [text]="'アップロードをキャンセルします。処理が完了しているものはキャンセルされません。よろしいですか？'" [submit_button_text]="'キャンセルする'"
                   (onOk)="csvCancel()" [type]="'warning'" [sending]="sending"></confirm-modal>

    <div *ngIf="workflow" bsModal #workflowModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-primary" [ngClass]="{'modal-danger':workflow_status == 'rejected' || workflow_status == 'back','modal-primary':workflow_status=='accepted'}" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">

                        <span *ngIf="workflow_status=='accepted'">
                            <ng-container *ngIf="workflow.is_salvage_acceptable">
                                引き上げ承認を行います
                            </ng-container>
                            <ng-container *ngIf="!workflow.is_salvage_acceptable">
                                申請を承認します
                            </ng-container>


                        </span>
                        <span *ngIf="workflow_status=='rejected'">申請を拒否します。</span>
                        <span *ngIf="workflow_status=='back'">ワークフローを一つ戻します。</span>
                    </h4>
                    <button type="button" class="close" (click)="deleteModal.hide()" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <ng-container *ngIf="workflow.is_salvage_acceptable">
                        <div class="text-danger pt-2 pb-2" style="font-size:16px">
                            ※前に承認者が残っていますが、引き上げ承認を行います。承認すると、前の承認者は承認がスキップされます。
                        </div>
                    </ng-container>
                    <div>
                        <h5>コメント（任意）</h5>
                        <textarea [(ngModel)]="workflow_comment" style="height:200px" class="form-control"></textarea>
                    </div>
                    <div class="mt-3" *ngIf="workflow_status=='accepted' && workflow.next_assigned_username">
                        <h5>次の承認者</h5>
                        <span>{{workflow.next_assigned_username}}</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" [ladda]='loading' class="btn btn-secondary btn-ladda" (click)="workflowModal.hide()">キャンセル</button>
                    <button [ladda]='loading' *ngIf="workflow_status=='accepted'" type="button" class="btn btn-success btn-ladda" (click)="setWorkflowStatus()">承認</button>
                    <button [ladda]='loading' *ngIf="workflow_status=='rejected'" type="button" class="btn btn-danger btn-ladda" (click)="setWorkflowStatus()">否認</button>
                    <button [ladda]='loading' *ngIf="workflow_status=='back'" type="button" class="btn btn-danger btn-ladda" (click)="setWorkflowStatus()">一つ戻す</button>
                    <button [ladda]='loading' *ngIf="workflow_status=='withdraw'" type="button" class="btn btn-warning btn-ladda" (click)="reapply()">取り下げ</button>
                </div>
            </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->


    <toaster-container></toaster-container>

</div>
<!--/.row-->

<!-- ファイル検索チャットボット -->
<chat-bot *ngIf="table && isFileSearchEnabled()"
          [table]="table"
          [table_info]="table_info"
          [type]="'file_search'"
          [data]="data"
          (onSetFilter)="onChatSetFilter($event)"></chat-bot>
