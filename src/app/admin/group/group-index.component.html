                <div class="loader">Loading...</div>
            </div>
        </ng-template>
        <ng-template #loaded_block>
            <div class="card">

                <div class="card-header">
                    <ng-container *ngFor="let bread of this.breadcrumbs">
                        <a class="group-index-bread" routerLinkActive="active" [routerLink]="'/admin/group/' + bread.id"><i class="fa fa-folder"></i> {{bread.name}}</a>
                    </ng-container>
                </div>
                -->
                <div class="card-block">
                    <directory-tree [menu_node]="this.menu_node"></directory-tree>
                </div>
            </div>
        </ng-template>
    </div>
    <!--/.col-->
</div>
<!--/.row-->
